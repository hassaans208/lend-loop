# Local automation stack: n8n + Mailpit (SMTP sink with a web inbox).
#   docker compose up -d
#   n8n:     http://localhost:5678
#   Mailpit: http://localhost:8025  (SMTP on mailpit:1025 inside the network)
#
# Secrets come from .env (never committed). See .env.example.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.123.96 # the version these workflows were tested on
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # --- core ---
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_PUBLIC_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=UTC
      - TZ=UTC
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Keep executions for debugging, but prune after 14 days (data minimisation).
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      # --- Code nodes: allow HMAC via Node's crypto, and reading the env vars below ---
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # --- LendLoop integration (read by the workflows via $env) ---
      - LENDLOOP_WEBHOOK_SECRET=${LENDLOOP_WEBHOOK_SECRET:?set LENDLOOP_WEBHOOK_SECRET in .env}
      - CONVEX_SITE_URL=${CONVEX_SITE_URL:?set CONVEX_SITE_URL in .env}
      - LENDLOOP_APP_URL=${LENDLOOP_APP_URL:-http://localhost:3000}
      - LENDLOOP_MAIL_FROM=${LENDLOOP_MAIL_FROM:-LendLoop <no-reply@lendloop.local>}
      - LENDLOOP_ALERT_EMAIL=${LENDLOOP_ALERT_EMAIL:-}
    volumes:
      - n8n_data:/home/node/.n8n
      # Workflow exports, read-only, for `n8n import:workflow` (see README).
      - ./n8n/workflows:/workflows:ro
    depends_on:
      - mailpit
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025" # web inbox
      - "1025:1025" # SMTP (only needed if you want to send from the host)
    volumes:
      - mailpit_data:/data

volumes:
  n8n_data:
  mailpit_data:
